<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8f5f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef7f5;
      --bg2: #dff0ec;
      --orb1: #b2ddd6;
      --orb2: #a8d4e8;
      --orb3: #c8e8e0;
      --glass: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.85);
      --glass-hover: rgba(255,255,255,0.75);
      --text: #1a3a35;
      --text-dim: rgba(26,58,53,0.6);
      --text-dimmer: rgba(26,58,53,0.35);
      --accent: #0d9488;
      --accent2: #0891b2;
      --accent-light: rgba(13,148,136,0.12);
      --tag-bg: rgba(13,148,136,0.1);
      --tag-text: #0d9488;
      --shadow: rgba(13,90,80,0.10);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* animated background orbs */
    .bg-orbs {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb1 { width: 600px; height: 600px; background: var(--orb1); top: -180px; left: -120px; animation-duration: 22s; }
    .orb2 { width: 500px; height: 500px; background: var(--orb2); bottom: -120px; right: -80px; animation-duration: 17s; animation-delay: -5s; }
    .orb3 { width: 350px; height: 350px; background: var(--orb3); top: 40%; left: 40%; animation-duration: 25s; animation-delay: -10s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.05); }
      66%  { transform: translate(-20px, 40px) scale(0.97); }
      100% { transform: translate(30px, 20px) scale(1.03); }
    }

    /* layout */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 1.75rem 2.5rem 0;
      display: flex; justify-content: space-between; align-items: center;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem; font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .admin-link {
      display: flex; align-items: center; gap: 6px;
      color: var(--text-dim); font-size: 0.82rem;
      text-decoration: none;
      padding: 5px 13px;
      border: 1px solid rgba(13,148,136,0.2);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .admin-link:hover { background: var(--glass-hover); color: var(--accent); border-color: rgba(13,148,136,0.4); }
    .admin-link svg { width: 13px; height: 13px; }

    main { padding: 2rem 2.5rem 4rem; flex: 1; }

    /* compact hero */
    .hero {
      margin-bottom: 1.75rem;
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .hero p { color: var(--text-dim); font-size: 0.9rem; font-weight: 400; }

    /* toolbar: search + filter on same line */
    .toolbar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1; min-width: 140px; max-width: 320px;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-dimmer); width: 15px; height: 15px; pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      backdrop-filter: blur(12px);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input::placeholder { color: var(--text-dimmer); }
    .search-input:focus { border-color: rgba(13,148,136,0.45); background: var(--glass-hover); }

    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid rgba(13,148,136,0.2);
      background: var(--glass);
      color: var(--text-dim);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.18s;
      backdrop-filter: blur(8px);
    }
    .filter-btn:hover { background: var(--glass-hover); color: var(--accent); }
    .filter-btn.active {
      background: var(--accent-light);
      border-color: rgba(13,148,136,0.4);
      color: var(--accent);
      font-weight: 500;
    }

    /* DESKTOP: card grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 1.25rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), border-color 0.2s, background 0.2s, box-shadow 0.2s;
      overflow: hidden;
      display: flex; flex-direction: column; gap: 0.85rem;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, transparent 60%);
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(13,148,136,0.3);
      background: var(--glass-hover);
      box-shadow: 0 12px 36px var(--shadow), 0 0 0 1px rgba(13,148,136,0.15);
    }

    .card-accent {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .card-body { flex: 1; }
    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1rem; font-weight: 700;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid rgba(13,148,136,0.18);
      font-weight: 500;
    }
    .card-arrow {
      color: var(--text-dimmer);
      width: 16px; height: 16px; flex-shrink: 0;
      transition: color 0.2s, transform 0.2s;
    }
    .card:hover .card-arrow { color: var(--accent); transform: translate(2px, -2px); }

    /* MOBILE: list rows */
    .list { display: none; flex-direction: column; gap: 0; }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      text-decoration: none; color: inherit;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 0.18s, border-color 0.18s;
      margin-bottom: 8px;
      border-radius: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .list-item:active { background: var(--glass-hover); border-color: rgba(13,148,136,0.3); }

    .list-accent {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .list-body { flex: 1; min-width: 0; }
    .list-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-tag {
      font-size: 0.72rem;
      color: var(--tag-text);
      margin-top: 2px;
      font-weight: 500;
    }
    .list-arrow {
      color: var(--text-dimmer);
      width: 16px; height: 16px; flex-shrink: 0;
    }

    /* empty state */
    .empty {
      text-align: center; padding: 3rem 2rem;
      color: var(--text-dimmer); font-size: 0.9rem;
    }
    .empty span { font-size: 2rem; display: block; margin-bottom: 0.75rem; opacity: 0.5; }

    /* count */
    .count { font-size: 0.78rem; color: var(--text-dimmer); margin-bottom: 0.75rem; }

    /* toast */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(13,148,136,0.12); backdrop-filter: blur(12px);
      border: 1px solid rgba(13,148,136,0.3);
      color: var(--text); font-size: 0.85rem;
      padding: 10px 20px; border-radius: 999px;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      opacity: 0; pointer-events: none; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 600px) {
      header { padding: 1.25rem 1.25rem 0; }
      main { padding: 1.25rem 1.25rem 2.5rem; }
      .hero { margin-bottom: 1.25rem; }
      .toolbar { margin-bottom: 1rem; }
      .grid { display: none; }
      .list { display: flex; }
      .search-wrap { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="page">
    <header>
      <div class="logo">⬡ Hub</div>
      <a href="admin.html" class="admin-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Admin
      </a>
    </header>

    <main>
      <div class="hero">
        <h1>PWA Launchpad</h1>
        <p id="subtitle">Loading…</p>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" type="text" id="search" placeholder="Search…" />
        </div>
        <div class="filter-bar" id="filter-bar">
          <button class="filter-btn active" data-tag="all">All</button>
        </div>
      </div>

      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="list" id="list"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allProjects = [];
    let activeTag = 'all';
    let searchQ = '';

    const CARD_COLORS = [
      { bg: 'rgba(13,148,136,0.15)',  text: '#0d9488' },
      { bg: 'rgba(8,145,178,0.15)',   text: '#0891b2' },
      { bg: 'rgba(5,150,105,0.15)',   text: '#059669' },
      { bg: 'rgba(99,102,241,0.15)',  text: '#6366f1' },
      { bg: 'rgba(234,88,12,0.15)',   text: '#ea580c' },
      { bg: 'rgba(217,70,239,0.15)',  text: '#d946ef' },
      { bg: 'rgba(2,132,199,0.15)',   text: '#0284c7' },
    ];

    const EMOJIS = ['🚀','⚡','🎯','🛠️','✨','🌊','🔮','🎨','📱','🧩'];

    function colorFor(id) {
      return CARD_COLORS[parseInt(id) % CARD_COLORS.length] || CARD_COLORS[0];
    }
    function emojiFor(id) {
      return EMOJIS[parseInt(id) % EMOJIS.length];
    }

    async function loadProjects() {
      try {
        const res = await fetch('projects.json?t=' + Date.now());
        allProjects = await res.json();
        init();
      } catch {
        showToast('Could not load projects.json');
        allProjects = [];
        init();
      }
    }

    function init() {
      const subtitle = document.getElementById('subtitle');
      subtitle.textContent = allProjects.length === 0
        ? 'No projects yet — add some in Admin!'
        : `${allProjects.length} project${allProjects.length > 1 ? 's' : ''} ready to launch`;

      buildFilters();
      render();

      document.getElementById('search').addEventListener('input', e => {
        searchQ = e.target.value.trim().toLowerCase();
        render();
      });
    }

    function buildFilters() {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = '<button class="filter-btn active" data-tag="all">All</button>';
      const tags = [...new Set(allProjects.flatMap(p => p.tags || []))].sort();
      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = tag;
        btn.textContent = tag;
        bar.appendChild(btn);
      });
      bar.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        activeTag = btn.dataset.tag;
        bar.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    }

    function render() {
      const grid = document.getElementById('grid');
      const list = document.getElementById('list');
      const count = document.getElementById('count');

      let filtered = allProjects.filter(p => {
        const matchTag = activeTag === 'all' || (p.tags || []).includes(activeTag);
        const matchQ = !searchQ || p.name.toLowerCase().includes(searchQ) || (p.description || '').toLowerCase().includes(searchQ);
        return matchTag && matchQ;
      });

      count.textContent = filtered.length && allProjects.length > filtered.length
        ? `Showing ${filtered.length} of ${allProjects.length}` : '';

      if (!filtered.length) {
        const emptyHtml = '<div class="empty"><span>🔍</span>No projects match.</div>';
        grid.innerHTML = emptyHtml;
        list.innerHTML = emptyHtml;
        return;
      }

      grid.innerHTML = '';
      list.innerHTML = '';

      filtered.forEach(p => {
        const c = colorFor(p.id);
        const emoji = emojiFor(p.id);
        const tagsHtml = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
        const firstTag = (p.tags || [])[0] || '';

        // Desktop card
        const a = document.createElement('a');
        a.className = 'card';
        a.href = p.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = p.name;
        a.innerHTML = `
          <div class="card-accent" style="background:${c.bg}; color:${c.text}">${emoji}</div>
          <div class="card-body">
            <div class="card-name">${escHtml(p.name)}</div>
            <div class="card-desc">${escHtml(p.description || '')}</div>
          </div>
          <div class="card-footer">
            <div class="tags">${tagsHtml}</div>
            <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </div>`;
        grid.appendChild(a);

        // Mobile list row
        const row = document.createElement('a');
        row.className = 'list-item';
        row.href = p.url || '#';
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
        row.title = p.name;
        row.innerHTML = `
          <div class="list-accent" style="background:${c.bg}; color:${c.text}">${emoji}</div>
          <div class="list-body">
            <div class="list-name">${escHtml(p.name)}</div>
            ${firstTag ? `<div class="list-tag">${escHtml(firstTag)}</div>` : ''}
          </div>
          <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`;
        list.appendChild(row);
      });
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    loadProjects();
  </script>
</body>
</html>
